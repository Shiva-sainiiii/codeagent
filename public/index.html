<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>CodeAgent</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- TOP BAR -->
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Projects">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title">
        <span id="projectName">No Project</span>
        <span id="projectSub" class="sub">tap menu to switch</span>
      </div>
      <button id="filesBtn" class="icon-btn" aria-label="Files">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
      </button>
    </header>

    <!-- PROJECT DRAWER -->
    <div id="drawerOverlay" class="drawer-overlay hidden"></div>
    <aside id="drawer" class="drawer hidden">
      <div class="drawer-header">
        <h3>Projects</h3>
        <button id="newProjectBtn" class="btn-small">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New
        </button>
      </div>
      <div id="projectList" class="project-list"></div>
    </aside>

    <!-- FILES PANEL -->
    <div id="filesOverlay" class="drawer-overlay hidden"></div>
    <aside id="filesPanel" class="drawer files-panel hidden">
      <div class="drawer-header">
        <h3>Files</h3>
        <div class="file-actions">
          <button id="importFilesBtn" class="btn-small">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Import
          </button>
          <button id="downloadZipBtn" class="btn-small">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Zip
          </button>
        </div>
      </div>
      <div id="fileList" class="file-list"></div>
    </aside>

    <!-- Hidden inputs for import: one for picking loose files (multi-select), one for a whole folder -->
    <input type="file" id="importFilesInput" multiple hidden
      accept=".js,.jsx,.ts,.tsx,.html,.htm,.css,.json,.md,.txt,.py,.java,.c,.cpp,.h,.go,.rs,.php,.rb,.sql,.yml,.yaml,.xml,.svg" />
    <input type="file" id="importFolderInput" webkitdirectory directory multiple hidden />

    <!-- IMPORT SOURCE PICKER (choose files vs folder) -->
    <div id="importPickerOverlay" class="modal-overlay hidden">
      <div class="modal-box">
        <h3 class="modal-title">Import code</h3>
        <p class="modal-message">Purane project ki files ya poora folder select karo. AI unhe padhega aur usi context ke saath aage kaam karega.</p>
        <div class="import-picker-actions">
          <button id="pickFilesBtn" class="modal-btn modal-btn-import">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/></svg>
            Pick files
          </button>
          <button id="pickFolderBtn" class="modal-btn modal-btn-import">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2Z"/></svg>
            Pick folder
          </button>
        </div>
        <div class="modal-actions">
          <button id="importPickerCancelBtn" class="modal-btn modal-btn-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- FULL-SCREEN LIVE PREVIEW -->
    <div id="previewModal" class="preview-modal hidden">
      <div class="preview-modal-header">
        <span id="previewFileName" class="preview-filename">Live Preview</span>
        <div class="preview-modal-actions">
          <button id="previewRefreshBtn" class="icon-btn small" aria-label="Refresh">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
          <button id="closePreviewBtn" class="icon-btn small" aria-label="Close">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="preview-frame-wrap">
        <iframe id="previewFrame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
      </div>
    </div>

    <!-- CHAT AREA -->
    <main id="chatArea" class="chat-area">
      <div id="chatLog" class="chat-log">
        <div class="empty-state" id="emptyState">
          <p>Chat mein bolo:</p>
          <p class="hint">"React component bana do" · "is file mein bug fix karo" · "naya project banao"</p>
        </div>
      </div>
    </main>

    <!-- INPUT BAR -->
    <footer class="input-bar">
      <div class="input-wrap">
        <textarea id="chatInput" placeholder="Message... (Hinglish chalega)" rows="1"></textarea>
      </div>
      <button id="sendBtn" class="send-btn" aria-label="Send">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.6 22 12 3.4 3.4 3 10l13 2-13 2z"/></svg>
      </button>
    </footer>

    <!-- CUSTOM MODAL (replaces browser prompt/confirm/alert) -->
    <div id="modalOverlay" class="modal-overlay hidden">
      <div id="modalBox" class="modal-box">
        <h3 id="modalTitle" class="modal-title"></h3>
        <p id="modalMessage" class="modal-message"></p>
        <input id="modalInput" class="modal-input hidden" type="text" />
        <div class="modal-actions">
          <button id="modalCancelBtn" class="modal-btn modal-btn-cancel">Cancel</button>
          <button id="modalOkBtn" class="modal-btn modal-btn-ok">OK</button>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast hidden"></div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
